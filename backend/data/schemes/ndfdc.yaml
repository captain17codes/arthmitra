code: NDFDC
name:
  en: "NDFDC Divyangjan Concessional Loan"
  mr: "राष्ट्रीय दिव्यांगजन वित्त महामंडळ सवलत कर्ज"
  hi: "राष्ट्रीय दिव्यांगजन वित्त एवं विकास निगम ऋण"
agency: "NDFDC"
status: unverified
source:
  url: "https://www.nhfdc.nic.in/"
  date: "2026-01-15"
channel:
  via: ["SCA", "Banks"]
  apply_at: "District Social Welfare Office / SCAs"
eligibility:
  - {field: disability_40, op: eq, value: true, reason: "needs_disability_40_percent"}
  - {field: age, op: between, value: [18, 55], reason: "age_18_55"}
negative_list: []
finance:
  loan_share: 0.90
  loan_cap: 2500000
  min_own_share: 0.10
  max_project_cost: 2500000
  subsidy: null
  interest:
    type: fixed
    rate: 0.05
  tenure_months: 84
  moratorium_months: 6
  moratorium_interest: simple
  moratorium_mode_default: capitalise
  repayment_frequency_months: 3
documents:
  - disability_certificate_udid
  - identity_proof
  - dpr
tests:
  - input: {project_cost: 1000000}
    expect: {loan: 900000}
