code: NSFDC_MFS
name:
  en: "NSFDC Micro Finance Scheme"
  mr: "एनएसएफडीसी सूक्ष्म वित्त योजना"
  hi: "एनएसएफडीसी माइक्रो फाइनेंस योजना"
agency: NSFDC
status: verified
source:
  url: "https://devmosje.negd.in/?p=15629"
  date: "2026-05-25"
channel:
  via: ["SCA", "PSB", "RRB"]
  apply_at: "MPBCDC district office / bank branch"
eligibility:
  - {field: category, op: in, value: ["SC"], reason: "needs_sc"}
  - {field: annual_family_income, op: lte, value: 500000, reason: "income_above_5l"}
  - {field: age, op: between, value: [18, 50], reason: "age_18_50"}
  - {field: project_cost, op: lte, value: 140000, reason: "project_upto_140k"}
negative_list: []
finance:
  loan_share: 0.90
  loan_cap: 125000
  min_own_share: 0.10
  max_project_cost: 140000
  subsidy: null
  interest:
    type: fixed
    rate: 0.065
  tenure_months: 36
  moratorium_months: 3
  moratorium_interest: simple
  moratorium_mode_default: capitalise
  repayment_frequency_months: 3
documents:
  - caste_certificate
  - income_certificate
  - residence_proof
  - dpr
  - quotations
  - bank_passbook
tests:
  - input: {margin: 10000}
    expect: {project_cost: 100000, loan: 90000, emi: 9147.23, n: 11}
  - input: {margin: 14000}
    expect: {project_cost: 139000, loan: 125000, emi: 12704.49, n: 11}
