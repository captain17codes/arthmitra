code: NBCFDC_GL
name:
  en: "NBCFDC General Loan Scheme"
  mr: "एनबीसीएफडीसी सर्वसाधारण मुदत कर्ज"
  hi: "एनबीसीएफडीसी सामान्य सावधि ऋण"
agency: "NBCFDC"
status: conflict
source:
  url: "https://nbcfdc.gov.in/nbcfdc/web/node/358"
  date: "2026-04-15"
channel:
  via: ["State Channelising Agencies (SCAs)", "Banks"]
  apply_at: "Maharashtra State OBC Corporation / SCA"
eligibility:
  - {field: category, op: in, value: ["OBC"], reason: "needs_obc"}
  - {field: annual_family_income, op: lte, value: 500000, reason: "income_above_ceiling"}
  - {field: age, op: between, value: [18, 50], reason: "age_18_50"}
  - {field: project_cost, op: lte, value: 1500000, reason: "project_upto_15l"}
negative_list: []
finance:
  loan_share: 0.85
  loan_cap: 1275000
  min_own_share: 0.15
  max_project_cost: 1500000
  subsidy: null
  interest:
    type: fixed
    rate: 0.07
  tenure_months: 96
  moratorium_months: 6
  moratorium_interest: simple
  moratorium_mode_default: capitalise
  repayment_frequency_months: 3
documents:
  - obc_caste_certificate
  - non_creamy_layer_certificate
  - income_certificate
  - project_report
tests:
  - input: {project_cost: 1000000, margin: 150000}
    expect: {loan: 850000}
