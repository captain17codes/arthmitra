services:
  - type: web
    name: arthmitra-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arthmitra-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: NOMINATIM_EMAIL
        value: support@arthmitra.org.in

databases:
  - name: arthmitra-db
    plan: free
    databaseName: arthmitra
    user: arthmitra_user
    region: singapore
