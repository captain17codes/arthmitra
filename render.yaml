services:
  - type: web
    name: arthmitra-api
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arthmitra-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SEED_DEMO_DATA
        value: "true"   # demo users + 3 villages; set to "false" once real data is loaded
      - key: NOMINATIM_EMAIL
        value: support@arthmitra.org.in

databases:
  - name: arthmitra-db
    plan: free
    databaseName: arthmitra
    user: arthmitra_user
    region: singapore
