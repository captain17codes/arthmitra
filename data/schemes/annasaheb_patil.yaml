code: ANNASAHEB_PATIL
name:
  en: "Annasaheb Patil Arthik Vikas Mahamandal Scheme"
  mr: "अण्णासाहेब पाटील आर्थिक मागास विकास महामंडळ"
  hi: "अन्नासाहेब पाटिल आर्थिक पिछड़ा विकास मंडल"
agency: "APAVM (Maharashtra)"
status: unverified
source:
  url: "https://sjsa.maharashtra.gov.in/"
  date: "2026-02-10"
channel:
  via: ["Banks with Interest Subvention", "District APAVM"]
  apply_at: "mahaswayam.gov.in"
eligibility:
  - {field: category, op: in, value: ["General", "Open"], reason: "needs_open_category"}
  - {field: age, op: between, value: [18, 50], reason: "age_18_50"}
negative_list: []
finance:
  loan_share: 0.85
  loan_cap: 1000000
  min_own_share: 0.15
  max_project_cost: 1000000
  subsidy: null
  interest:
    type: bank_rate
    rate: 0.10
  tenure_months: 60
  moratorium_months: 6
  moratorium_interest: simple
  moratorium_mode_default: capitalise
  repayment_frequency_months: 1
documents:
  - age_proof
  - bank_sanction_letter
  - project_report
tests:
  - input: {project_cost: 500000}
    expect: {loan: 425000}
