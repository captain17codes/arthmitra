code: MUDRA_KISHOR
name:
  en: "Pradhan Mantri Mudra Yojana - Kishor"
  mr: "मुद्रा योजना - किशोर"
  hi: "प्रधानमंत्री मुद्रा योजना - किशोर"
agency: "PMMY / MUDRA"
status: verified
source:
  url: "https://www.mudra.org.in/"
  date: "2026-03-31"
channel:
  via: ["Commercial Banks", "RRBs", "SFBs", "MFIs"]
  apply_at: "Bank branch / udyamimitra.in"
eligibility:
  - {field: age, op: gte, value: 18, reason: "min_age_18"}
  - {field: project_cost, op: gt, value: 50000, reason: "project_above_50k"}
  - {field: project_cost, op: lte, value: 500000, reason: "project_upto_5l"}
negative_list: []
finance:
  loan_share: 0.85
  loan_cap: 500000
  min_own_share: 0.15
  min_project_cost: 50001
  max_project_cost: 500000
  subsidy: null
  interest:
    type: bank_rate
    rate: 0.11
  tenure_months: 60
  moratorium_months: 6
  moratorium_interest: simple
  moratorium_mode_default: capitalise
  repayment_frequency_months: 1
documents:
  - identity_proof
  - quotation_machinery
  - last_6_months_bank_statement
tests:
  - input: {loan: 300000}
    expect: {mor_int: 16500.00, emi: 7457.21, total: 402689.38}
