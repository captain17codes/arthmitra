code: NSKFDC
name:
  en: "NSKFDC Term Loan (Safai Karamcharis)"
  mr: "राष्ट्रीय सफाई कर्मचारी वित्त महामंडळ मुदत कर्ज"
  hi: "राष्ट्रीय सफाई कर्मचारी वित्त एवं विकास निगम ऋण"
agency: "NSKFDC"
status: unverified
source:
  url: "https://nskfdc.nic.in/"
  date: "2026-01-15"
channel:
  via: ["SCA", "RRB"]
  apply_at: "Designated District Channelising Agency"
eligibility:
  - {field: occupation_flag_safai, op: eq, value: true, reason: "needs_safai_karamchari_flag"}
  - {field: age, op: between, value: [18, 50], reason: "age_18_50"}
negative_list: []
finance:
  loan_share: 0.90
  loan_cap: 1500000
  min_own_share: 0.10
  max_project_cost: 1500000
  subsidy: null
  interest:
    type: fixed
    rate: 0.06
  tenure_months: 60
  moratorium_months: 6
  moratorium_interest: simple
  moratorium_mode_default: capitalise
  repayment_frequency_months: 3
documents:
  - safai_karamchari_certificate
  - income_certificate
  - residence_proof
tests:
  - input: {project_cost: 500000}
    expect: {loan: 450000}
