code: DAY_NRLM_SHG
name:
  en: "DAY-NRLM Women SHG Interest Subvention"
  mr: "दीनदयाळ अंत्योदय योजना - राष्ट्रीय ग्रामीण उपजीविका अभियान (NRLM)"
  hi: "दीनदयाल अंत्योदय योजना - राष्ट्रीय ग्रामीण आजीविका मिशन"
agency: "MoRD / UMED (Maharashtra)"
status: verified
source:
  url: "https://nrlm.gov.in/"
  date: "2026-03-15"
channel:
  via: ["Bank Linkage", "UMED"]
  apply_at: "Gram Panchayat / Village Organization (VO)"
eligibility:
  - {field: shg_member, op: eq, value: true, reason: "needs_shg_membership"}
  - {field: gender, op: eq, value: "female", reason: "women_shg_only"}
  - {field: project_cost, op: lte, value: 300000, reason: "subvention_upto_3l"}
negative_list: []
finance:
  loan_share: 0.90
  loan_cap: 300000
  min_own_share: 0.10
  max_project_cost: 300000
  subsidy: null
  interest:
    type: fixed
    rate: 0.07
  tenure_months: 36
  moratorium_months: 0
  moratorium_interest: simple
  moratorium_mode_default: capitalise
  repayment_frequency_months: 1
documents:
  - shg_resolution
  - bank_passbook_shg
  - panchsutra_compliance_record
tests:
  - input: {project_cost: 200000}
    expect: {loan: 180000}
