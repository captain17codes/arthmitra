code: MUDRA_TARUN_PLUS
name:
  en: "Pradhan Mantri Mudra Yojana - Tarun Plus"
  mr: "मुद्रा योजना - तरुण प्लस"
  hi: "प्रधानमंत्री मुद्रा योजना - तरुण प्लस"
agency: "PMMY / MUDRA"
status: verified
source:
  url: "https://www.mudra.org.in/"
  date: "2026-03-31"
channel:
  via: ["Commercial Banks", "RRBs", "SFBs"]
  apply_at: "Bank branch / udyamimitra.in"
notes:
  - "MUDRA interest rate and margin are decided by the lending bank; figures shown are typical, not fixed."
eligibility:
  - {field: age, op: gte, value: 18, reason: "min_age_18"}
  - {field: project_cost, op: gt, value: 1000000, reason: "project_above_10l"}
  - {field: project_cost, op: lte, value: 2000000, reason: "project_upto_20l"}
negative_list: []
finance:
  loan_share: 0.85
  loan_cap: 2000000
  min_own_share: 0.15
  min_project_cost: 1000001
  max_project_cost: 2000000
  subsidy: null
  interest:
    type: bank_rate
    rate: 0.12
  bank_decides: ["interest", "min_own_share", "tenure"]
  tenure_months: 84
  moratorium_months: 6
  moratorium_interest: simple
  moratorium_mode_default: capitalise
  repayment_frequency_months: 1
documents:
  - tarun_repayment_record
  - udyam_registration
  - dpr
tests:
  - input: {loan: 1500000}
    expect: {tenure: 84}
