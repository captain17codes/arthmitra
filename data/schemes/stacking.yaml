# Stacking Rules Configuration
# Invariant: NEVER two capital subsidies on the same asset.

capital_subsidy_schemes:
  - PMEGP
  - CMEGP
  - MPBCDC_SEED
  - PMFME

interest_subvention_schemes:
  - DAY_NRLM_SHG
  - ANNASAHEB_PATIL

allowed_combinations:
  - id: standup_plus_state_margin
    description: "Stand-Up India bank term loan paired with MPBCDC state margin support"
    primary: STANDUP_INDIA
    secondary: MPBCDC_SEED
    allow_capital_subsidy_stack: false

  - id: mudra_plus_interest_subvention
    description: "MUDRA bank loan paired with DAY-NRLM women SHG 7% interest subvention"
    primary: MUDRA_KISHOR
    secondary: DAY_NRLM_SHG
    allow_capital_subsidy_stack: false

  - id: pmegp_standalone
    description: "PMEGP credit-linked capital subsidy (standalone capital grant)"
    primary: PMEGP
    secondary: null
    allow_capital_subsidy_stack: false
