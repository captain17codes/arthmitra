code: LASDC
name:
  en: "Lokshahir Annabhau Sathe Dev Corp Scheme"
  mr: "लोकशाहीर अण्णाभाऊ साठे विकास महामंडळ योजना"
  hi: "लोकशाहीर अन्नाभाऊ साठे विकास निगम योजना"
agency: "LASDC (Maharashtra)"
status: unverified
source:
  url: "https://sjsa.maharashtra.gov.in/"
  date: "2026-02-10"
channel:
  via: ["District LASDC Office", "Banks"]
  apply_at: "District LASDC Office"
capital_subsidy: true
eligibility:
  - {field: category, op: in, value: ["SC"], reason: "needs_sc"}
  - {field: age, op: between, value: [18, 50], reason: "age_18_50"}
negative_list: []
finance:
  loan_share: 0.85
  loan_cap: 500000
  min_own_share: 0.15
  max_project_cost: 500000
  subsidy: null
  interest:
    type: fixed
    rate: 0.04
  tenure_months: 60
  moratorium_months: 6
  moratorium_interest: simple
  moratorium_mode_default: capitalise
  repayment_frequency_months: 3
documents:
  - caste_certificate
  - income_certificate
tests:
  - input: {project_cost: 200000}
    expect: {loan: 170000}
